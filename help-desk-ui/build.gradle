plugins {
    id 'base'
    id 'maven-publish'
}

group = 'com.endeavorms.velocity'
version = project.findProperty('publishVersion') ?: '1.2.0-SNAPSHOT'

// Publish the zip artifact created by the CI workflow
// Usage: ./gradlew publishZip -PpublishVersion=1.2.0-SNAPSHOT
// The workflow creates dist/help-desk-ui/help-desk-ui-${version}.zip before running this

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri('https://maven.pkg.github.com/Vertek-Corporation/help-desk-ui')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            artifactId = 'help-desk-ui'
            artifact(file("dist/help-desk-ui/help-desk-ui-${version}.zip")) {
                extension = 'zip'
            }
        }
    }
}
