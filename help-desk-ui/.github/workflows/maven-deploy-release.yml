name: Gradle Deploy Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help-desk-ui
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          registry-url: https://npm.pkg.github.com/
      - run: |
          echo "@vertek-corporation:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}" >> .npmrc
      - run: npm i
      - run: npm run build:prod --omit=dev
      - name: Get NPM Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
      - name: Create zip
        run: |
          cd dist/help-desk-ui
          zip -r help-desk-ui-${{steps.package-version.outputs.current-version}}.zip .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Publish to GitHub Packages with Gradle
        working-directory: help-desk-ui
        env:
          PUBLISH_VERSION: ${{ steps.package-version.outputs.current-version }}
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publish -PpublishVersion="$PUBLISH_VERSION"
