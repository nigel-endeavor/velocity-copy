# Build and publish help-desk-ui release with npm + Gradle

name: Gradle Deploy Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help-desk-ui
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          registry-url: https://npm.pkg.github.com/
      - run: |
          echo "@vertek-corporation:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}" >> .npmrc
      - run: npm i
      - run: npm run build:prod --omit=dev
      - name: Get NPM Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
      - name: Create zip
        run: |
          cd dist/help-desk-ui
          zip -r help-desk-ui-${{steps.package-version.outputs.current-version}}.zip .
      - name: Publish to GitHub Packages with Gradle
        run: ../qto/gradlew -p . publishGprPublicationToGitHubPackagesRepository -PpublishVersion=${{steps.package-version.outputs.current-version}}
        env:
          GITHUB_ACTOR: rcasey-vertek
          GITHUB_TOKEN: ${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}
