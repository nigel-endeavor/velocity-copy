# Build and publish help-desk-ui release with Bun + Gradle

name: Gradle Deploy Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help-desk-ui
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v2
        with:
          registries: |
            @endeavorms:https://npm.pkg.github.com/|${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}
      - run: bun install
      - run: bun run build:prod --omit=dev
      - name: Get package version
        id: package-version
        run: echo "current-version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      - name: Create zip
        run: |
          cd dist/help-desk-ui
          zip -r help-desk-ui-${{steps.package-version.outputs.current-version}}.zip .
      - name: Publish to GitHub Packages with Gradle
        run: ../qto/gradlew -p . publishGprPublicationToGitHubPackagesRepository -PpublishVersion=${{steps.package-version.outputs.current-version}}
        env:
          GITHUB_ACTOR: rcasey-vertek
          GITHUB_TOKEN: ${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}
