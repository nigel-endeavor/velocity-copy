# Build QTO using Gradle

name: Gradle Publish

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x qto/qto-spring-boot-app/gradlew
      - name: Build with Gradle
        run: qto/qto-spring-boot-app/gradlew -p qto/qto-spring-boot-app clean build
