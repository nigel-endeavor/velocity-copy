# Dependency check using Gradle build

name: Dependency Check

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  depchecktest:
    runs-on: ubuntu-latest
    name: dependency_check
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x qto/qto-spring-boot-app/gradlew

      - name: Build with Gradle
        run: qto/qto-spring-boot-app/gradlew -p qto/qto-spring-boot-app clean build

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        id: Depcheck
        with:
          project: 'qto'
          path: 'qto/qto-spring-boot-app'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Test results
        uses: actions/upload-artifact@v4
        with:
          name: Depcheck report
          path: reports
