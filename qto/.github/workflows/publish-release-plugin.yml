# Release workflow - uses Gradle for build and publish
# Note: For version bumping and tagging, consider using a Gradle release plugin
# or manual version updates. This workflow publishes the current version.

name: Gradle Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Build and Publish with Gradle
        run: ./gradlew clean build publish -x test
        env:
          GITHUB_ACTOR: mwelicka
          GITHUB_TOKEN: ${{ secrets.RC_PACKAGES_READ_WRITE_TOKEN }}
