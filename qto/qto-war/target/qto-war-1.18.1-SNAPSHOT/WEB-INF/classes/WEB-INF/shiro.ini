[main]
# Demo mode: realm that accepts any credentials and grants all permissions
demoRealm = com.vertek.corporate.qto.authentication.DemoAllAccessRealm
securityManager.realms = $demoRealm

# Demo filter: auto-authenticates every request so @RequiresPermissions works
demoAuth = com.vertek.corporate.qto.authentication.DemoAutoAuthFilter

[urls]
# All requests go through demoAuth which auto-logs in as demo-user before
# reaching JAX-RS @RequiresPermissions AOP checks
/api/** = demoAuth
/** = demoAuth
