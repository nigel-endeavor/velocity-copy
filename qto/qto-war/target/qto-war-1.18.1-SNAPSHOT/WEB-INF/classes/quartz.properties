#============================================================================
# Configure Main Scheduler Properties
#============================================================================

org.quartz.scheduler.instanceName = ${qto.org.quartz.scheduler.instanceName}

org.quartz.scheduler.instanceId = AUTO
org.quartz.scheduler.skipUpdateCheck = true
org.quartz.scheduler.dbFailureRetryInterval = 10000

#============================================================================
# Configure ThreadPool
#============================================================================

org.quartz.threadPool.threadCount = 5

#============================================================================
# Jobstore - Using RAMJobStore for local dev (avoids javax.transaction.UserTransaction ClassNotFound on WildFly 27 Jakarta EE 10)
# For production, restore: org.quartz.jobStore.class = org.quartz.impl.jdbcjobstore.JobStoreCMT
#============================================================================

org.quartz.jobStore.class = org.quartz.simpl.RAMJobStore


#============================================================================
# Job Initialization Plugin
#============================================================================

org.quartz.plugin.jobInitializer.class = org.quartz.plugins.xml.XMLSchedulingDataProcessorPlugin
org.quartz.plugin.jobInitializer.fileNames = quartz-jobs.xml
org.quartz.plugin.jobInitializer.failOnFileNotFound = true

# Set the scan interval to 0 to disable scanning because classloader issues when deployed in jboss prevent the file
# from being found and the resulting error was bloating the logs - 08/18/2012 - JDD
org.quartz.plugin.jobInitializer.scanInterval = 0
org.quartz.plugin.jobInitializer.wrapInUserTransaction = false

# cleanShutdown set to false so that jvm shut down won't be blocked by stuck job.  (NOCP-141)
org.quartz.plugin.shutdownhook.class = org.quartz.plugins.management.ShutdownHookPlugin
org.quartz.plugin.shutdownhook.cleanShutdown = false
