spring:
  main:
    allow-circular-references: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration
      - org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration

  # Disable Boot's single-datasource auto wiring assumptions for liquibase (we'll wire it ourselves)
  liquibase:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  artemis:
    mode: embedded

app:
  datasource:
    qto:
      url: jdbc:mysql://localhost:3306/qto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: qto_user
      password: changeme
      driver-class-name: com.mysql.cj.jdbc.Driver
    platform:
      url: jdbc:mysql://localhost:3306/platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: platform_user
      password: changeme
      driver-class-name: com.mysql.cj.jdbc.Driver
  jms:
    enabled: false
  
qto:
  jms:
    broker-url: vm://0

