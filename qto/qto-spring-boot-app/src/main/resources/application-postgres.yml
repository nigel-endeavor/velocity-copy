# PostgreSQL Database Profile
# Activate with: --spring.profiles.active=postgres
# Or set environment variable: SPRING_PROFILES_ACTIVE=postgres

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qto}
    username: ${DB_USER:qto_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.endeavorms.qto: DEBUG
    org.hibernate.SQL: DEBUG
