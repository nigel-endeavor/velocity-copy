# MySQL Database Profile
# Activate with: --spring.profiles.active=mysql
# Or set environment variable: SPRING_PROFILES_ACTIVE=mysql

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qto}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:qto_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.endeavorms.qto: DEBUG
    org.hibernate.SQL: DEBUG
