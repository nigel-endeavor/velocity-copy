# QTO Spring Boot Application Configuration
# PostgreSQL database with Liquibase migrations

spring:
  application:
    name: qto-application

  main:
    allow-circular-references: true

  # autoconfigure:
    # exclude:
      # - org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration
      # - org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration

  # Java 21 Virtual Threads (Project Loom)
  # Enables lightweight threads for Tomcat request handling - improves scalability
  threads:
    virtual:
      enabled: true

  # PostgreSQL Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qto}
    username: ${DB_USER:qto_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: false
        use_sql_comments: true
        format_sql: false

  # Liquibase Database Migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # JMS / Artemis (embedded broker for dev)
  artemis:
    mode: embedded
  jms:
    cache:
      enabled: true

  # Quartz Scheduler (uses main datasource)
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: QtoScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 60000
      org.quartz.plugin.jobInitializer.class: org.quartz.plugins.xml.XMLSchedulingDataProcessorPlugin
      org.quartz.plugin.jobInitializer.fileNames: quartz-jobs.xml
      org.quartz.plugin.jobInitializer.failOnFileNotFound: true
      org.quartz.plugin.jobInitializer.scanInterval: 0

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /qto
  tomcat:
    threads:
      max: 200
      min-spare: 10
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Management Endpoints (Spring Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.endeavorms.qto: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific configuration
qto:
  version: 1.18.1-SNAPSHOT
  tenant:
    default-id: 1
  file-storage:
    base-path: ${QTO_FILE_STORAGE:/var/qto/files}
    max-file-size: 10MB
