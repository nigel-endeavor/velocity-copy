services:
  postgres:
    image: postgres:16-alpine
    container_name: qto-postgres
    environment:
      POSTGRES_DB: qto
      POSTGRES_USER: qto_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persistent DB data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qto_user -d qto"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes persist data across container restarts and removals.
# Data survives `docker compose down` (use `docker compose down -v` to remove).
volumes:
  postgres-data:
    driver: local
