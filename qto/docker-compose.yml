services:
  postgres:
    image: postgres:16-alpine
    container_name: qto-postgres
    environment:
      POSTGRES_DB: qto
      POSTGRES_USER: qto_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persistent DB data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qto_user -d qto"]
      interval: 5s
      timeout: 5s
      retries: 5

  qto-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qto-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/qto
      - SPRING_DATASOURCE_USERNAME=qto_user
      - SPRING_DATASOURCE_PASSWORD=changeme
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local