services:
  postgres:
    image: postgres:16-alpine
    container_name: qto-postgres
    environment:
      POSTGRES_DB: qto
      POSTGRES_USER: qto_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persistent DB data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qto_user -d qto"]
      interval: 5s
      timeout: 5s
      retries: 5

  qto-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qto-app
    ports:
      - "8080:8080"
    environment:
      - APP_DATASOURCE_QTO_URL=jdbc:postgresql://postgres:5432/qto
      - APP_DATASOURCE_QTO_USERNAME=qto_user
      - APP_DATASOURCE_QTO_PASSWORD=changeme
      - APP_DATASOURCE_PLATFORM_URL=jdbc:postgresql://postgres:5432/qto?currentSchema=platform
      - APP_DATASOURCE_PLATFORM_USERNAME=qto_user
      - APP_DATASOURCE_PLATFORM_PASSWORD=changeme
    depends_on:
      postgres:
        condition: service_healthy

  qto-ui:
    build:
      context: ../qto-ui
      dockerfile: Dockerfile
    container_name: qto-ui
    ports:
      - "4200:80"
    depends_on:
      - qto-app

volumes:
  postgres-data:
    driver: local