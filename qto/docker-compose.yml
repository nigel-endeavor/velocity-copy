services:
  postgres:
    image: postgres:16-alpine
    container_name: qto-postgres
    environment:
      POSTGRES_DB: qto-main
      POSTGRES_USER: qto_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qto_user -d qto-main"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
