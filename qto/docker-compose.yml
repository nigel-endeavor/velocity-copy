services:
  mysql:
    image: mysql:8.0
    container_name: qto-mysql
    environment:
      MYSQL_DATABASE: qto
      MYSQL_USER: qto_user
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "qto_user", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  postgres:
    image: postgres:16-alpine
    container_name: qto-postgres
    environment:
      POSTGRES_DB: qto
      POSTGRES_USER: qto_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qto_user -d qto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local
  postgres-data:
    driver: local
