name: Gradle Package - Test Snapshot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qto-ui
    steps:
     - uses: actions/checkout@v3
     - uses: actions/setup-node@v3
       with:
        node-version: 16
     - run: npm ci
     - run: npm run build:test --omit=dev
     - name: Get NPM Version
       id: package-version
       uses: martinbeentjes/npm-get-version-action@main
     - name: Create zip
       run: |
        cd dist/qto-ui
        zip -r qto-ui-${{steps.package-version.outputs.current-version}}-TEST-SNAPSHOT.zip .
     - name: Set up JDK 17
       uses: actions/setup-java@v4
       with:
         java-version: '17'
         distribution: 'temurin'
         cache: 'gradle'
     - name: Publish to GitHub Packages with Gradle
       working-directory: qto-ui
       env:
         PUBLISH_VERSION: ${{ steps.package-version.outputs.current-version }}-TEST-SNAPSHOT
         USERNAME: ${{ github.actor }}
         TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: gradle publish -PpublishVersion="$PUBLISH_VERSION"
