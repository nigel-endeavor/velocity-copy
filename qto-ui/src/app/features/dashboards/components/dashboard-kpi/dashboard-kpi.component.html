<div class="report-container">
  <div [style.display]="this.showNetworkDeliveryIntervalChart ? 'grid' : 'none'">
    <div class="report">
      <div class="canvas-container" [class.expanded]="networkDeliveryIntervalChartConfig.expanded">
        <div class="header">
          <div class="title">
            Network Delivery Interval
          </div>
          <div class="actions">
            <div class="action-item">
              <span class="material-symbols-outlined" (click)="networkDeliveryIntervalChartConfig.expanded = !networkDeliveryIntervalChartConfig.expanded">open_in_new</span>
            </div>
          </div>
        </div>
        <canvas id="networkDeliveryIntervalChart"></canvas>
      </div>
    </div>


  </div>
</div>

<app-loading-spinner *ngIf="(isLoading$ | async) || excelService.isLoading"></app-loading-spinner>
