<div class="container">
  <div class="loader" *ngIf="isLoading$ | async">
    <mat-spinner></mat-spinner>
  </div>
  <ng-container *ngIf="selectedLocationOrService$ | async as service">
    <ng-container [ngSwitch]="service.type">
      <app-service-az-ethernet *ngSwitchCase="ServiceType.ETHERNET" [service]="getSelectedService(service)" [location]="selectedLocation$ | async" [companyId]="companyId" (save)="saveService($event)"></app-service-az-ethernet>
    </ng-container>
  </ng-container>
</div>
