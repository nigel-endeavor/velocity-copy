<div>
  <header class="header">
    <h2 mat-dialog-title>{{ title }}</h2>
    <button class="material-symbols-outlined closeButton" (click)="onClose()">close</button>
  </header>

  <div class="table-actions" *ngIf="(searchCriteria$ | async) as searchCriteria">
    <input type="text" placeholder="Search..." [ngModel]="searchCriteria.search" (input)="onSearch($event)">
  </div>

  <app-link-service-table #table class="link-service-table"
                          [columns]="(columns$ | async) || []"
                          [tableData]="(tableData$ | async) || []"
                          [tableTotal]="(tableTotal$ | async)"
                          [searchCriteria]="(searchCriteria$ | async)"
                          [showMultiEdit]="multiSelect"
                          [selectedIds]="(selectedItemsIds$ | async)"
                          (rowClick)="data.selectedParentServiceId= $event.id"
                          (changeSortClicked)="onChangeSortClicked($event)"
                          (setActive)="onSelectAllClick([$event])"
                          (setActiveAll)="onSelectAllClick($event)"
                          (pageClicked)="onFilterChanged($event, 'offset')">
  </app-link-service-table>

  <ng-container *ngIf="(selectedItemsIds$ | async) as selectedIds">
    <div class="table-actions">
      <button mat-raised-button color="primary" [disabled]="selectedIds.length == 0"
              (click)="save(selectedIds)">{{ title }}

      </button>
      <button mat-raised-button color="primary" (click)="onClose()">Cancel</button>
    </div>
  </ng-container>
</div>
