<div mat-dialog-content>
  <div>
    <h2>You have an unsubmitted order from {{data.timeStamp | date:'medium'}}</h2>
    <h3>Would you like to continue creating this order?</h3>
  </div>
  <div [style.display]="'flex'" [style.gap]="'1em'">
    <button class="btn blue" [mat-dialog-close]="true">Yes, Continue My Order</button>
    <button class="btn gray" [mat-dialog-close]="false">No, Start a New Order</button>
  </div>
</div>
