<div mat-dialog-content>
  <div>
    <h2>This record has open Jeopardies assocaited.</h2>
    <h3>Do you wish to close them with today's date?</h3>
  </div>
  <div [style.display]="'flex'" [style.gap]="'1em'">
    <button class="btn blue" [mat-dialog-close]="true">Yes</button>
    <button class="btn gray" [mat-dialog-close]="false">No</button>
  </div>
</div>
