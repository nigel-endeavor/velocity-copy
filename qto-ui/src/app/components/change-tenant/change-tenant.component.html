<div class="change-tenant">
  <p>Subject: {{displayName}}</p>
  <div *ngIf="selectedTenant">
    <select [(ngModel)]="selectedTenant">
      <option *ngFor="let tenant of tenantNames" [value]="tenant">{{tenant}}</option>
    </select>
    <button (click)="onUpdateTenantClicked()">Update Tenant</button>
  </div>
</div>

<dialog class="change-tenant-dialog" #dialog>
  <p>Your tenant has been updated.  The application will now reload.</p>
</dialog>
